name: languagetool

services:
  languagetool:
    build:
      context: .
      args:
        VERSION: ${VERSION}
    image: ghcr.io/mwerlen/docker-languagetool:${VERSION}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8081}:8081"
    volumes:
      # JVM memory is sized at start from the languages found here
      - ${NGRAMS_DIR:-./ngrams}:/ngrams:ro
      # also bundled in the image: editing it then `make restart` applies it
      - ./misc/server.properties:/config/server.properties:ro
    cap_drop:
      - ALL
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
